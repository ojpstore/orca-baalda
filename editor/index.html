<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        font: 15px/1.7 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--orca-foreground);
        background: var(--orca-background);
      }
      .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--orca-border); }
      #title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      #state { font-size: 12px; color: var(--orca-muted-foreground); }
      .bar button {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--orca-input);
        border-radius: 6px;
        background: var(--orca-secondary);
        color: var(--orca-secondary-foreground);
        font: 13px system-ui, sans-serif;
        cursor: pointer;
      }
      .bar button:focus-visible, textarea:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -2px; }
      main { flex: 1; overflow: auto; }
      #view { padding: 24px 32px 64px; }
      #view h1 { font-size: 1.9em; line-height: 1.25; margin: 0.2em 0 0.6em; }
      #view h2 { font-size: 1.4em; margin: 1.4em 0 0.5em; }
      #view h3 { font-size: 1.15em; margin: 1.2em 0 0.4em; }
      #view a { color: var(--orca-primary); }
      #view code { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; padding: 0.1em 0.35em; border-radius: 4px; background: var(--orca-muted); }
      #view .code { position: relative; }
      #view pre { padding: 12px 14px; border-radius: 8px; background: var(--orca-muted); overflow: auto; }
      #view .code .copy { position: absolute; top: 6px; right: 6px; padding: 2px 8px; border: 1px solid var(--orca-border); border-radius: 5px; background: var(--orca-card); color: var(--orca-muted-foreground); font: 11px system-ui, sans-serif; cursor: pointer; opacity: 0; }
      #view .code:hover .copy, #view .code .copy:focus-visible { opacity: 1; }
      #view pre code { padding: 0; background: none; }
      #view blockquote { margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--orca-border); color: var(--orca-muted-foreground); }
      #view table { border-collapse: collapse; }
      #view th, #view td { border: 1px solid var(--orca-border); padding: 4px 10px; }
      #view hr { border: 0; border-top: 1px solid var(--orca-border); }
      #view .wikilink { color: var(--orca-primary); text-decoration: none; border-bottom: 1px dashed currentColor; cursor: pointer; }
      #view .wikilink:hover { border-bottom-style: solid; }
      #page { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
      #view .props { margin: 0 0 1.2em; padding: 8px 12px; border-radius: 8px; background: var(--orca-muted); color: var(--orca-muted-foreground); font: 12px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
      #view .empty { color: var(--orca-muted-foreground); }
      textarea {
        display: block;
        width: 100%;
        height: 100%;
        padding: 24px 32px;
        border: 0;
        resize: none;
        background: var(--orca-background);
        color: var(--orca-foreground);
        font: 14px/1.7 ui-monospace, Consolas, monospace;
      }
      #tools { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 8px; border-bottom: 1px solid var(--orca-border); }
      #tools button {
        min-width: 28px;
        height: 26px;
        padding: 0 6px;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--orca-foreground);
        font: 13px system-ui, sans-serif;
        cursor: pointer;
      }
      #tools button:hover { background: var(--orca-muted); }
      #tools button:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -2px; }
      #tools .sep { width: 1px; margin: 4px 4px; background: var(--orca-border); }
      #emoji {
        position: fixed;
        z-index: 10;
        display: flex;
        flex-direction: column;
        width: 360px;
        max-width: calc(100vw - 16px);
        border: 1px solid var(--orca-border);
        border-radius: 10px;
        background: var(--orca-popover, var(--orca-card));
        color: var(--orca-foreground);
        box-shadow: 0 8px 28px rgb(0 0 0 / 0.35);
        overflow: hidden;
      }
      #emoji .search { padding: 10px 10px 6px; }
      #emoji input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--orca-input);
        border-radius: 8px;
        background: var(--orca-background);
        color: var(--orca-foreground);
        font: 13px system-ui, sans-serif;
      }
      #emoji input:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -1px; }
      #emoji button { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; cursor: pointer; }
      #emoji button:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -2px; }
      #emoji .tabs { display: flex; padding: 0 6px; border-bottom: 1px solid var(--orca-border); }
      #emoji .tabs button { flex: 1; height: 34px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 16px; filter: grayscale(1); opacity: 0.6; }
      #emoji .tabs button:hover { opacity: 1; }
      #emoji .tabs button.on { border-bottom-color: var(--orca-primary); filter: none; opacity: 1; }
      #emoji .list { position: relative; height: 270px; overflow-y: auto; padding: 0 8px 8px; }
      #emoji h4 { margin: 10px 2px 4px; font: 700 13px system-ui, sans-serif; }
      #emoji .grid { display: grid; grid-template-columns: repeat(auto-fill, 36px); gap: 2px; }
      #emoji .grid button { width: 36px; height: 36px; padding: 0; border: 0; border-radius: 6px; background: none; font-size: 22px; line-height: 1; }
      #emoji .grid button:hover { background: var(--orca-muted); }
      #emoji .none { margin: 16px 4px; color: var(--orca-muted-foreground); font-size: 13px; }
      #emoji .preview { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; border-top: 1px solid var(--orca-border); font-size: 13px; }
      #emoji .preview .big { font: 28px/1 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
      #top {
        position: fixed; right: 20px; bottom: 20px; z-index: 5;
        display: grid; place-items: center; width: 36px; height: 36px; padding: 0;
        border: 1px solid var(--orca-border); border-radius: 50%;
        background: var(--orca-secondary); color: var(--orca-secondary-foreground);
        box-shadow: 0 4px 14px rgb(0 0 0 / 0.3); cursor: pointer;
      }
      #top:hover { background: var(--orca-muted); }
      #top:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: 2px; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
      ::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 5px; background: color-mix(in srgb, var(--orca-foreground) 75%, transparent) padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--orca-foreground) 90%, transparent) padding-box; }
      #find { display: flex; align-items: center; gap: 2px; }
      #find input { width: 180px; height: 28px; padding: 0 8px; border: 1px solid var(--orca-input); border-radius: 6px; background: var(--orca-background); color: var(--orca-foreground); font: 13px system-ui, sans-serif; }
      #find input:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -1px; }
      #find .count { min-width: 44px; padding: 0 4px; font-size: 12px; color: var(--orca-muted-foreground); text-align: center; }
      .bar #find button { width: 28px; padding: 0; border: 0; background: none; color: var(--orca-foreground); }
      .bar #find button:hover { background: var(--orca-muted); }
      ::highlight(find) { background: rgb(255 200 0 / 0.35); }
      ::highlight(find-now) { background: rgb(255 140 0 / 0.85); color: #000; }
      #view.tts .copy, #view.tts .props, #view.tts pre { display: none; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="bar"><strong id="title"></strong><span id="state"></span><div id="find" role="search" hidden><input type="search" placeholder="찾기" aria-label="노트에서 찾기" spellcheck="false" /><span class="count" aria-live="polite"></span><button data-d="-1" title="이전 (Shift+Enter)" aria-label="이전">↑</button><button data-d="1" title="다음 (Enter)" aria-label="다음">↓</button><button data-d="0" title="닫기 (Esc)" aria-label="닫기">✕</button></div><button id="speak" title="소리 내어 읽기" hidden>읽기</button><button id="mode" hidden>편집</button></div>
    <div id="tools" role="toolbar" aria-label="Markdown 서식" hidden>
      <button data-t="h1" title="제목 1">H1</button>
      <button data-t="h2" title="제목 2">H2</button>
      <button data-t="h3" title="제목 3">H3</button>
      <span class="sep"></span>
      <button data-t="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button data-t="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
      <button data-t="strike" title="취소선"><s>S</s></button>
      <button data-t="code" title="인라인 코드">&lt;/&gt;</button>
      <button data-t="link" title="링크 (Ctrl+K)">🔗</button>
      <span class="sep"></span>
      <button data-t="ul" title="글머리 목록">•</button>
      <button data-t="ol" title="번호 목록">1.</button>
      <button data-t="task" title="체크리스트">☐</button>
      <button data-t="quote" title="인용">❝</button>
      <span class="sep"></span>
      <button data-t="block" title="코드 블록">{ }</button>
      <button data-t="table" title="표">▦</button>
      <button data-t="hr" title="구분선">―</button>
      <span class="sep"></span>
      <button data-t="emoji" title="이모지" aria-expanded="false" aria-controls="emoji">😀</button>
    </div>
    <div id="emoji" role="dialog" aria-label="이모지" hidden>
      <div class="search"><input type="search" placeholder="이모지 검색" aria-label="이모지 검색" spellcheck="false" /></div>
      <div class="tabs"></div>
      <div class="list"></div>
      <div class="preview"><span class="big"></span><span class="name"></span></div>
    </div>
    <main>
      <article id="view"></article>
      <iframe id="page" title="페이지" sandbox="allow-scripts allow-popups" hidden></iframe>
      <textarea id="source" aria-label="노트 내용" spellcheck="false" hidden></textarea>
    </main>
    <button id="top" title="맨 위로" aria-label="맨 위로" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
