<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        font: 15px/1.7 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--orca-foreground);
        background: var(--orca-background);
      }
      .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--orca-border); }
      #title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      #state { font-size: 12px; color: var(--orca-muted-foreground); }
      .bar button {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--orca-input);
        border-radius: 6px;
        background: var(--orca-secondary);
        color: var(--orca-secondary-foreground);
        font: 13px system-ui, sans-serif;
        cursor: pointer;
      }
      .bar button:focus-visible, textarea:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -2px; }
      main { flex: 1; overflow: auto; }
      #view { padding: 24px 32px 64px; }
      #view h1 { font-size: 1.9em; line-height: 1.25; margin: 0.2em 0 0.6em; }
      #view h2 { font-size: 1.4em; margin: 1.4em 0 0.5em; }
      #view h3 { font-size: 1.15em; margin: 1.2em 0 0.4em; }
      #view a { color: var(--orca-primary); }
      #view code { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; padding: 0.1em 0.35em; border-radius: 4px; background: var(--orca-muted); }
      #view .code { position: relative; }
      #view pre { padding: 12px 14px; border-radius: 8px; background: var(--orca-muted); overflow: auto; }
      #view .code .copy { position: absolute; top: 6px; right: 6px; padding: 2px 8px; border: 1px solid var(--orca-border); border-radius: 5px; background: var(--orca-card); color: var(--orca-muted-foreground); font: 11px system-ui, sans-serif; cursor: pointer; opacity: 0; }
      #view .code:hover .copy, #view .code .copy:focus-visible { opacity: 1; }
      #view pre code { padding: 0; background: none; }
      #view blockquote { margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--orca-border); color: var(--orca-muted-foreground); }
      #view table { border-collapse: collapse; }
      #view th, #view td { border: 1px solid var(--orca-border); padding: 4px 10px; }
      #view hr { border: 0; border-top: 1px solid var(--orca-border); }
      #view .wikilink { color: var(--orca-primary); text-decoration: none; border-bottom: 1px dashed currentColor; cursor: pointer; }
      #view .wikilink:hover { border-bottom-style: solid; }
      #page { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
      #view .props { margin: 0 0 1.2em; padding: 8px 12px; border-radius: 8px; background: var(--orca-muted); color: var(--orca-muted-foreground); font: 12px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
      #view .empty { color: var(--orca-muted-foreground); }
      textarea {
        display: block;
        width: 100%;
        height: 100%;
        padding: 24px 32px;
        border: 0;
        resize: none;
        background: var(--orca-background);
        color: var(--orca-foreground);
        font: 14px/1.7 ui-monospace, Consolas, monospace;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="bar"><strong id="title"></strong><span id="state"></span><button id="mode" hidden>편집</button></div>
    <main>
      <article id="view"></article>
      <iframe id="page" title="페이지" sandbox="allow-scripts allow-popups" hidden></iframe>
      <textarea id="source" aria-label="노트 내용" spellcheck="false" hidden></textarea>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
